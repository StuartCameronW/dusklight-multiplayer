# Dusklight multiplayer rendezvous (join codes). Workers FREE plan only -- see README.md "Cost guard".
name = "dusk-mp-rendezvous"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served on mp.kong.bike (Stuart's Free zone), where the free WAF rate-limit rule applies.
# workers.dev is off: it would bypass the WAF rule.
workers_dev = false
preview_urls = false
routes = [{ pattern = "mp.kong.bike", custom_domain = true }]

[vars]
# Manual off-switch: "1" makes every route answer 503 {"error":"disabled"} without touching a Durable Object.
DISABLED = "0"
# "0" turns off the legacy host long-poll (GET /v1/rooms/{code}/wait). See README "Long-poll vs WebSocket".
LONGPOLL = "0"  # the game hosts over /ws; long-poll holds the DO awake (costly), so it is off
# Rooms the whole service may create per UTC day (the CreateCap DO). Past it, creates answer 503 {"error":"daily_cap"}.
CREATE_CAP_PER_DAY = "3000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "CREATE_CAP"
class_name = "CreateCap"

# SQLite-backed classes are the only Durable Objects available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "RateLimiter"]

# Never edit an applied migration; add a new tag.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["CreateCap"]
